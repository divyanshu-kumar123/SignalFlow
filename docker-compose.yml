services:
  redis:
    image: redis:alpine
    networks:
      - signalflow-network

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - REDIS_HOST=redis
    networks:
      - signalflow-network
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    networks:
      - signalflow-network
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  signalflow-network:
    driver: bridge